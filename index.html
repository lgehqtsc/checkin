<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>[PRI]교육참가 확인 페이지</title>
<style>
  :root{
    --ink:#1d2b26;
    --paper:#f6f3ec;
    --line:#cfc6b4;
    --moss:#2f6f5e;
    --moss-deep:#214f42;
    --clay:#b5603f;
    --ok:#2f6f5e;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:var(--paper);
    font-family:'Helvetica Neue', Arial, sans-serif;
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
  }
  body{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
  }

  .stamp{
    width:100%;
    max-width:560px;
    background:#fffdf8;
    border:1px solid var(--line);
    border-radius:18px;
    padding:48px 44px 40px;
    box-shadow:0 30px 60px -30px rgba(33,79,66,0.25);
    position:relative;
    overflow:hidden;
  }
  .stamp::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0;
    height:6px;
    background:repeating-linear-gradient(90deg, var(--moss) 0 18px, var(--clay) 18px 36px);
    opacity:.85;
  }

  .fs-btn{
    position:absolute;
    top:16px;
    right:16px;
    width:40px;
    height:40px;
    border-radius:10px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--moss-deep);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:5;
    transition:background .12s ease, transform .08s ease;
  }
  .fs-btn:active{ transform:scale(0.93); background:#f1ede2; }
  .fs-btn svg{ width:20px; height:20px; }

  .eyebrow{
    font-size:15px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--moss-deep);
    font-weight:700;
    margin:0 0 10px;
    padding-right:48px;
  }

  h1{
    font-size:30px;
    line-height:1.35;
    margin:0 0 4px;
    font-weight:700;
    word-break:keep-all;
  }
  .sub{
    margin:0 0 32px;
    color:#5b5347;
    font-size:20px;
  }

  label{
    display:block;
    font-size:13px;
    font-weight:700;
    letter-spacing:.04em;
    color:var(--moss-deep);
    margin-bottom:10px;
  }

  .display{
    width:100%;
    min-height:74px;
    font-size:36px;
    letter-spacing:.12em;
    padding:14px 18px;
    border:2px solid var(--line);
    border-radius:12px;
    background:#fff;
    text-align:center;
    font-weight:700;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:border-color .15s ease;
    word-break:break-all;
  }
  .display.filled{ border-color:var(--moss); }
  .display .placeholder{ color:#bdb4a1; font-weight:500; font-size:22px; letter-spacing:0; }
  .display .caret{
    display:inline-block;
    width:2px; height:34px;
    background:var(--moss);
    margin-left:4px;
    animation:blink 1s step-end infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  .keypad{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
    margin-top:16px;
  }
  .key{
    padding:20px 0;
    font-size:24px;
    font-weight:700;
    border:1px solid var(--line);
    border-radius:12px;
    background:#fff;
    color:var(--ink);
    cursor:pointer;
    transition:transform .08s ease, background .12s ease;
    -webkit-user-select:none;
    user-select:none;
    display:flex;
    align-items:center;
    justify-content:center;
    line-height:1;
  }
  .key:active{ transform:scale(0.95); background:#f1ede2; }
  .key.zero{ grid-column:2; }
  .key.clear{
    font-size:15px;
    color:var(--clay);
    border-color:#e3c4b3;
  }
  .key.back{
    font-size:20px;
    color:#5b5347;
  }

  button{
    width:100%;
    margin-top:14px;
    padding:20px;
    font-size:19px;
    font-weight:700;
    letter-spacing:.02em;
    border:none;
    border-radius:12px;
    background:var(--moss-deep);
    color:#fdf9f0;
    cursor:pointer;
    transition:transform .08s ease, background .15s ease;
  }
  button:active{
    transform:scale(0.985);
  }
  button:disabled{
    background:#9c9382;
    cursor:default;
  }

  .msg{
    margin-top:18px;
    min-height:24px;
    text-align:center;
    font-size:15px;
    font-weight:600;
  }
  .msg.ok{color:var(--ok);}
  .msg.err{color:var(--clay);}

  .footer-line{
    margin-top:28px;
    padding-top:18px;
    border-top:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:#8a8170;
    letter-spacing:.02em;
  }

  .check-overlay{
    position:fixed;
    inset:0;
    background:rgba(33,79,66,0.96);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    color:#fdf9f0;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
    text-align:center;
    padding:24px;
  }
  .check-overlay.show{
    opacity:1;
    pointer-events:all;
  }
  .check-mark{
    width:88px;height:88px;
    border-radius:50%;
    border:3px solid #fdf9f0;
    display:flex;align-items:center;justify-content:center;
    margin-bottom:22px;
    transform:scale(.7);
    transition:transform .35s cubic-bezier(.34,1.56,.64,1);
  }
  .check-overlay.show .check-mark{ transform:scale(1); }
  .check-mark svg{width:42px;height:42px;}
  .check-overlay h2{ font-size:30px; margin:0 0 8px; }
  .check-overlay p{ margin:0; font-size:15px; opacity:.85; }
</style>
</head>
<body>

  <div class="stamp">
    <button type="button" class="fs-btn" id="fsBtn" aria-label="전체화면 전환" title="전체화면 전환">
      <svg id="fsIconExpand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 3H5a2 2 0 0 0-2 2v3"></path>
        <path d="M21 8V5a2 2 0 0 0-2-2h-3"></path>
        <path d="M3 16v3a2 2 0 0 0 2 2h3"></path>
        <path d="M16 21h3a2 2 0 0 0 2-2v-3"></path>
      </svg>
      <svg id="fsIconCollapse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
        <path d="M8 3v3a2 2 0 0 1-2 2H3"></path>
        <path d="M21 8h-3a2 2 0 0 1-2-2V3"></path>
        <path d="M3 16h3a2 2 0 0 1 2 2v3"></path>
        <path d="M16 21v-3a2 2 0 0 1 2-2h3"></path>
      </svg>
    </button>

    <p class="eyebrow">참가 확인</p>
    <h1 id="courseTitle">과정명 불러오는 중…</h1>
    <p class="sub">사번을 입력한 뒤 '제출' 버튼을 눌러주세요.</p>

    <form id="checkinForm" autocomplete="off">
      <label for="employeeId">사번</label>
      <div class="display" id="display">
        <span class="placeholder" id="placeholder">사번을 입력해주세요</span>
      </div>

      <div class="keypad" id="keypad">
        <div class="key" data-key="1">1</div>
        <div class="key" data-key="2">2</div>
        <div class="key" data-key="3">3</div>
        <div class="key" data-key="4">4</div>
        <div class="key" data-key="5">5</div>
        <div class="key" data-key="6">6</div>
        <div class="key" data-key="7">7</div>
        <div class="key" data-key="8">8</div>
        <div class="key" data-key="9">9</div>
        <div class="key clear" data-action="clear">전체삭제</div>
        <div class="key zero" data-key="0">0</div>
        <div class="key back" data-action="back">←</div>
      </div>

      <button type="submit" id="submitBtn">제출</button>
      <div class="msg" id="msg"></div>
    </form>

    <div class="footer-line">
      <span id="clock">--:--:--</span>
      <span>한국 표준시 기준 기록</span>
    </div>
  </div>

  <div class="check-overlay" id="overlay">
    <div class="check-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <h2 id="overlayName">출석이 확인되었습니다</h2>
    <p id="overlaySub"></p>
  </div>

<script>
  // ===== 여기에 배포한 Apps Script 웹 앱 URL을 넣어주세요 =====
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbykmkH12t_kCE78G7JyASX1b_Z9kEGzxTS7_20wSmmoP5IHNzUPUmP-aOWLbk_5l9y1/exec";
  // ============================================================

  const courseTitle = document.getElementById('courseTitle');
  const form = document.getElementById('checkinForm');
  const display = document.getElementById('display');
  const keypad = document.getElementById('keypad');
  const submitBtn = document.getElementById('submitBtn');
  const msg = document.getElementById('msg');
  const overlay = document.getElementById('overlay');
  const overlaySub = document.getElementById('overlaySub');
  const clock = document.getElementById('clock');

  let employeeId = '';
  const MAX_LEN = 12;

  function renderDisplay(){
    if(employeeId.length === 0){
      display.innerHTML = '<span class="placeholder">사번을 입력해주세요</span>';
      display.classList.remove('filled');
    } else {
      display.innerHTML = employeeId + '<span class="caret"></span>';
      display.classList.add('filled');
    }
  }
  renderDisplay();

  keypad.addEventListener('click', function(e){
    const keyEl = e.target.closest('.key');
    if(!keyEl) return;

    const digit = keyEl.dataset.key;
    const action = keyEl.dataset.action;

    if(digit !== undefined){
      if(employeeId.length < MAX_LEN){
        employeeId += digit;
        renderDisplay();
        showMsg('', '');
      }
    } else if(action === 'back'){
      employeeId = employeeId.slice(0, -1);
      renderDisplay();
    } else if(action === 'clear'){
      employeeId = '';
      renderDisplay();
      showMsg('', '');
    }
  });

  function showMsg(text, type){
    msg.textContent = text;
    msg.className = 'msg ' + (type || '');
  }

  function tickClock(){
    const now = new Date();
    const kst = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Seoul' }));
    const hh = String(kst.getHours()).padStart(2,'0');
    const mm = String(kst.getMinutes()).padStart(2,'0');
    const ss = String(kst.getSeconds()).padStart(2,'0');
    clock.textContent = `${hh}:${mm}:${ss}`;
  }
  setInterval(tickClock, 1000);
  tickClock();

  async function loadCourseName(){
    try{
      const res = await fetch(SCRIPT_URL, { method: 'GET' });
      const data = await res.json();
      courseTitle.textContent = data.courseName || '과정명이 설정되지 않았습니다';
    }catch(e){
      courseTitle.textContent = '과정명을 불러올 수 없습니다';
    }
  }
  loadCourseName();

  let submitting = false;

  function sendRecord(employeeId, retry){
    const body = new URLSearchParams({ employeeId });
    fetch(SCRIPT_URL, { method: 'POST', body })
      .then(res => res.json())
      .then(data => {
        if(data.status !== 'success' && !retry){
          // 한 번 더 조용히 재시도
          sendRecord(employeeId, true);
        }
      })
      .catch(()=>{
        if(!retry){
          sendRecord(employeeId, true);
        }
      });
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    if(submitting) return;

    if(!employeeId){
      showMsg('사번을 입력해주세요.', 'err');
      return;
    }

    submitting = true;
    submitBtn.disabled = true;

    const idToSend = employeeId;

    // 1) 화면은 즉시 완료 처리 (체감 속도 향상)
    overlaySub.textContent = `${courseTitle.textContent} · 사번 ${idToSend}`;
    overlay.classList.add('show');
    showMsg('', '');
    employeeId = '';
    renderDisplay();

    // 2) 실제 기록은 백그라운드에서 전송
    sendRecord(idToSend, false);

    setTimeout(()=>{
      overlay.classList.remove('show');
      submitting = false;
      submitBtn.disabled = false;
    }, 900);
  });

  // ===== 전체화면 토글 =====
  const fsBtn = document.getElementById('fsBtn');
  const fsIconExpand = document.getElementById('fsIconExpand');
  const fsIconCollapse = document.getElementById('fsIconCollapse');

  function isFullscreen(){
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }

  function updateFsIcon(){
    if(isFullscreen()){
      fsIconExpand.style.display = 'none';
      fsIconCollapse.style.display = '';
    } else {
      fsIconExpand.style.display = '';
      fsIconCollapse.style.display = 'none';
    }
  }

  async function toggleFullscreen(){
    const el = document.documentElement;
    try{
      if(!isFullscreen()){
        if(el.requestFullscreen) await el.requestFullscreen();
        else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      } else {
        if(document.exitFullscreen) await document.exitFullscreen();
        else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    }catch(e){
      // 전체화면 API 미지원 환경 (일부 모바일 브라우저 등) - 조용히 무시
      console.warn('전체화면 전환 실패:', e);
    }
  }

  fsBtn.addEventListener('click', toggleFullscreen);
  document.addEventListener('fullscreenchange', updateFsIcon);
  document.addEventListener('webkitfullscreenchange', updateFsIcon);

</script>

</body>
</html>
